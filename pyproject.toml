[project]
name = "gadgetdisk-scripts"
version = "0.1.0"
description = "GadgetDisk 模块工程的构建、打包、测试、检查与部署工具集"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gd-build = "scripts.build.cli:main"
gd-check = "scripts.check.cli:main"
gd-deploy = "scripts.deploy.cli:main"
gd-package = "scripts.package.cli:main"
gd-test = "scripts.test.cli:main"

[dependency-groups]
dev = [
  "pyright==1.1.414",
  "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["scripts"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
include = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "PLE", "PLW", "RUF"]

ignore = [
  "RUF001",
  "RUF002",
  "RUF003",
]
